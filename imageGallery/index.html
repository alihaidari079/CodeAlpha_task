<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Image Gallery</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div class="gallery-wrap">
    <button class="btn prev">&#10094;</button>
<div class="gallery">
    <div>
      <span><img src="images/A.jpg" alt=""></span>
      <span><img src="images/B.jpg" alt=""></span>
      <span><img src="images/C.jpg" alt=""></span>
    </div>
    <div>
      <span><img src="images/D.jpg" alt=""></span>
      <span><img src="images/E.jpg" alt=""></span>
      <span><img src="images/F.png" alt=""></span>
    </div>
    <div>
      <span><img src="images/G.jpg" alt=""></span>
      <span><img src="images/H.jpg" alt=""></span>
      <span><img src="images/I.JPG" alt=""></span>
    </div>
  </div>
    <button class="btn next">&#10095;</button>
  </div>
  
  <script src="index.js"></script>
</body>
</html>
